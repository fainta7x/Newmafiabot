name: Repair dev dependency vulnerability

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/dev-vulnerability-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply lockfile-only audit fix
        run: npm audit fix --package-lock-only
      - name: Verify full dependency audit
        run: npm audit --audit-level=high
      - name: Verify nanoid path
        run: npm ls nanoid
      - name: Commit lockfile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already secure"
          else
            git commit -m "deps: patch vulnerable nanoid transitive"
            git push origin HEAD:audit/dev-vulnerability-20260818
          fi
