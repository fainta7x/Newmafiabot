name: ChatGPT achievements migration candidate

on:
  push:
    branches:
      - automation/achievements-stage-2026-08-09

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inspect source of truth once
        run: |
          set -euo pipefail
          git fetch origin main chatgpt-write-test --prune
          echo "branch=$(git branch --show-current)"
          echo "upstream=$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}')"
          echo "stage_head=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse origin/main)"
          echo "status:"
          git status --short
          test "$(git rev-parse origin/main)" = "d94237900c4318dc4486236e749c3a9eab8fd7d3"
          test "$(git rev-parse origin/chatgpt-write-test)" = "d94237900c4318dc4486236e749c3a9eab8fd7d3"

      - name: Apply focused achievements implementation
        run: |
          set -euo pipefail
          cp automation/patch_achievements_migration.py /tmp/patch_achievements_migration.py
          git checkout --detach d94237900c4318dc4486236e749c3a9eab8fd7d3
          python /tmp/patch_achievements_migration.py
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf '%s\n' "${changed[@]}"
          allowed='^(src/lib/achievementCatalog\.ts|src/server/services/playerAchievementsService\.ts|src/db/schema\.ts|src/db/index\.ts|src/server/routes/playersRoutes\.ts|src/server/routes/botRoutes\.ts|src/server/routes/gamesRoutes\.ts|src/server/routes/tournamentProtocolRoutes\.ts|src/app\.ts|src/lib/api\.ts|src/components/crm/PlayerProfileContent\.tsx|src/tests/playerAchievements\.test\.ts)$'
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected file: $file"; exit 1; }
          done

      - name: Install dependencies
        run: npm ci

      - name: Focused achievement tests
        run: npx vitest run src/tests/playerAchievements.test.ts

      - name: Commit candidate only
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/achievementCatalog.ts src/server/services/playerAchievementsService.ts src/db/schema.ts src/db/index.ts src/server/routes/playersRoutes.ts src/server/routes/botRoutes.ts src/server/routes/gamesRoutes.ts src/server/routes/tournamentProtocolRoutes.ts src/app.ts src/lib/api.ts src/components/crm/PlayerProfileContent.tsx src/tests/playerAchievements.test.ts
          git commit -m "feat(players): migrate legacy achievements"
          candidate=$(git rev-parse HEAD)
          git push origin "$candidate:refs/heads/automation/achievements-candidate-2026-08-09"
          echo "candidate=$candidate"
