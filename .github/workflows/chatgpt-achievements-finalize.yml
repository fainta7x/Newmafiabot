name: ChatGPT achievements migration finalize

on:
  push:
    branches:
      - automation/achievements-finalize-2026-08-09

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify unchanged working refs and exact candidate
        run: |
          set -euo pipefail
          git fetch origin main chatgpt-write-test automation/achievements-candidate-2026-08-09 --prune
          test "$(git rev-parse origin/main)" = "d94237900c4318dc4486236e749c3a9eab8fd7d3"
          test "$(git rev-parse origin/chatgpt-write-test)" = "d94237900c4318dc4486236e749c3a9eab8fd7d3"
          test "$(git rev-parse origin/automation/achievements-candidate-2026-08-09)" = "caf9d83ce925e91f357e12c57e3e5e80afad57ce"
          git checkout --detach caf9d83ce925e91f357e12c57e3e5e80afad57ce
          files=$(git diff --name-only d94237900c4318dc4486236e749c3a9eab8fd7d3..HEAD)
          printf '%s\n' "$files"
          test "$(printf '%s\n' "$files" | wc -l)" -eq 12
          if printf '%s\n' "$files" | grep -Eq '(^mafia_crm|checkpoint|player-avatars|uploads|public/player-avatars)'; then
            echo 'Forbidden data/snapshot/avatar change detected'; exit 1;
          fi

      - name: Install dependencies
        run: npm ci

      - name: Final typecheck
        run: npm run typecheck

      - name: Final production build
        run: npm run build

      - name: Final diff check and atomic fast-forward
        run: |
          set -euo pipefail
          git diff --check d94237900c4318dc4486236e749c3a9eab8fd7d3..caf9d83ce925e91f357e12c57e3e5e80afad57ce
          git push --atomic origin \
            caf9d83ce925e91f357e12c57e3e5e80afad57ce:refs/heads/main \
            caf9d83ce925e91f357e12c57e3e5e80afad57ce:refs/heads/chatgpt-write-test
