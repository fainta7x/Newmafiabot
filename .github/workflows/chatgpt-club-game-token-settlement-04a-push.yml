name: ChatGPT club game token settlement 04A push

on:
  push:
    branches:
      - automation/club-game-token-settlement-04a-push-2026-08-10

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact scope and fast-forward main
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "1d04fbfb6f2f8b193f2d5b125859807004440be7"
          git cat-file -e d6bb46accaac3b6e7ce218a0aadb21a99fe085a9^{commit}
          git merge-base --is-ancestor origin/main d6bb46accaac3b6e7ce218a0aadb21a99fe085a9
          files=$(git diff --name-only origin/main..d6bb46accaac3b6e7ce218a0aadb21a99fe085a9)
          printf '%s\n' "$files"
          test "$(printf '%s\n' "$files" | wc -l)" -eq 5
          allowed='^(drizzle/0010_club_game_token_settlements\.sql|src/db/index\.ts|src/server/routes/gamesRoutesBase\.ts|src/server/services/clubGameTokenSettlementService\.ts|src/tests/clubGameTokenSettlement\.test\.ts)$'
          while IFS= read -r file; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected file: $file"; exit 1; }
          done <<< "$files"
          if printf '%s\n' "$files" | grep -Eq '(^mafia_crm|checkpoint|avatar|uploads|\.sqlite$|\.db$)'; then
            echo 'Forbidden runtime/data/avatar change detected'; exit 1
          fi
          git diff --check origin/main..d6bb46accaac3b6e7ce218a0aadb21a99fe085a9
          git push origin d6bb46accaac3b6e7ce218a0aadb21a99fe085a9:refs/heads/main
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "d6bb46accaac3b6e7ce218a0aadb21a99fe085a9"
          echo "main=$(git rev-parse origin/main)"
