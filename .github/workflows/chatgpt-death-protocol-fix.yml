name: ChatGPT death protocol finish fix

on:
  push:
    branches: [chatgpt-write-test]
    paths:
      - scripts/chatgpt_apply_death_protocol_fix.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-write-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply targeted patch
        run: python3 scripts/chatgpt_apply_death_protocol_fix.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Remove one-off patch machinery
        run: rm -f scripts/chatgpt_apply_death_protocol_fix.py .github/workflows/chatgpt-death-protocol-fix.yml
      - name: Commit verified patch
        run: |
          git config user.name "ChatGPT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(live-game): finish after final mafia death"
          git push origin HEAD:chatgpt-write-test
