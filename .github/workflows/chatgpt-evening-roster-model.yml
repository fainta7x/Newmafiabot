name: ChatGPT evening roster model

on:
  push:
    branches:
      - chatgpt-write-test
    paths:
      - .github/workflows/chatgpt-evening-roster-model.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-write-test
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply final game setup patch
        run: python3 scripts/chatgpt_evening_roster_model.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Remove one-off patch machinery
        run: |
          rm scripts/chatgpt_evening_roster_model.py
          rm .github/workflows/chatgpt-evening-roster-model.yml
      - name: Commit verified redesign
        run: |
          git config user.name 'ChatGPT Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(evenings): decouple roster from tables'
          git push origin HEAD:chatgpt-write-test
