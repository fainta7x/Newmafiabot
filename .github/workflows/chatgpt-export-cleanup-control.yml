name: ChatGPT export cleanup control
on:
  push:
    branches: [automation/export-cleanup-2026-08-09]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current checkout once
        run: |
          set -euo pipefail
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          echo "status-start"
          git status --short
          echo "status-end"
          echo "export-files-start"
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) | grep -Ei 'tournamentResultsExport|ResultsImageExportModal|SeatingExport|Standings|Nominations|OfficialResults|GameResults|export' | sort
          echo "export-files-end"
