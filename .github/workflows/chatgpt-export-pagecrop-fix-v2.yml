name: ChatGPT export page viewport fix v2
on:
  push:
    branches: [automation/export-preview-pages-pagecrop-fix-v2-2026-08-09]
permissions:
  contents: write
jobs:
  fix-and-visualize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture QA scripts and guard candidate
        run: |
          set -euo pipefail
          cp automation/patch_page_viewport.py /tmp/patch_page_viewport.py
          cp automation/render_export_pagecrop_qa.ts /tmp/render_export_pagecrop_qa.ts
          git fetch origin main automation/export-preview-pages-candidate-2026-08-09
          test "$(git rev-parse origin/main)" = "3021c2fe6d836aa6438e9940eefeac44c541f0f1"
          CANDIDATE="$(git rev-parse origin/automation/export-preview-pages-candidate-2026-08-09)"
          test "$CANDIDATE" = "ddf1fd7aefd8ab09fa1d4c58ce6d00e7b7c2cb2e"
          git checkout --detach "$CANDIDATE"
          test -z "$(git status --short)"
      - name: Apply semantic page viewport fix
        run: |
          set -euo pipefail
          python /tmp/patch_page_viewport.py
          test "$(git diff --name-only)" = "src/lib/tournamentResultsExport.ts"
      - name: Install dependencies
        run: npm ci
      - name: Focused pagination regression
        run: npx vitest run src/tests/resultExportPublication.test.ts
      - name: Render current canonical exports
        run: |
          set -euo pipefail
          cp /tmp/render_export_pagecrop_qa.ts ./render_export_pagecrop_qa.ts
          npx tsx render_export_pagecrop_qa.ts
          rm render_export_pagecrop_qa.ts
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin >/dev/null
          for svg in visual-qa/pagecrop/*.svg; do
            png="${svg%.svg}.png"
            phone="${svg%.svg}-phone.png"
            rsvg-convert "$svg" -o "$png"
            rsvg-convert -w 390 -h 488 "$svg" -o "$phone"
            rm "$svg"
          done
      - name: Commit viewport fix to existing candidate
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/tournamentResultsExport.ts
          git commit -m "fix(tournaments): paginate export blocks by viewport"
          SHA="$(git rev-parse HEAD)"
          echo "candidate_sha=$SHA"
          git push origin "$SHA:refs/heads/automation/export-preview-pages-candidate-2026-08-09"
      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: export-page-viewport-visual-qa-v2
          path: visual-qa/pagecrop/
          retention-days: 1
