name: ChatGPT export page viewport fix
on:
  push:
    branches: [automation/export-preview-pages-pagecrop-fix-2026-08-09]
permissions:
  contents: write
jobs:
  fix-and-visualize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard candidate and apply semantic viewport fix
        run: |
          set -euo pipefail
          git fetch origin main automation/export-preview-pages-candidate-2026-08-09
          test "$(git rev-parse origin/main)" = "3021c2fe6d836aa6438e9940eefeac44c541f0f1"
          CANDIDATE="$(git rev-parse origin/automation/export-preview-pages-candidate-2026-08-09)"
          test "$CANDIDATE" = "ddf1fd7aefd8ab09fa1d4c58ce6d00e7b7c2cb2e"
          git checkout --detach "$CANDIDATE"
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/tournamentResultsExport.ts')
          s = p.read_text(encoding='utf-8')
          old1 = """  const clipId = `page-clip-${pageNumber}`;
          const translatedY = contentTop - descriptor.start;
          """
          new1 = """  const sourceHeight = descriptor.end - descriptor.start;
          """
          old2 = """      <defs><clipPath id="${clipId}"><rect x="0" y="${contentTop}" width="${EXPORT_PAGE_WIDTH}" height="${contentHeight}"/></clipPath></defs>
                <g clip-path="url(#${clipId})" transform="translate(0 ${translatedY})">${inner}</g>
          """
          new2 = """      <svg x="0" y="${contentTop}" width="${EXPORT_PAGE_WIDTH}" height="${sourceHeight}" viewBox="0 ${descriptor.start} ${EXPORT_PAGE_WIDTH} ${sourceHeight}" preserveAspectRatio="xMinYMin meet" overflow="hidden">${inner}</svg>
          """
          if s.count(old1) != 1: raise SystemExit(f'viewport vars match={s.count(old1)}')
          if s.count(old2) != 1: raise SystemExit(f'viewport markup match={s.count(old2)}')
          p.write_text(s.replace(old1, new1, 1).replace(old2, new2, 1), encoding='utf-8')
          print('semantic page viewport patched')
          PY
          test "$(git diff --name-only)" = "src/lib/tournamentResultsExport.ts"
      - name: Install dependencies
        run: npm ci
      - name: Focused pagination test after viewport fix
        run: npx vitest run src/tests/resultExportPublication.test.ts
      - name: Render current real pages for visual verification
        run: |
          set -euo pipefail
          cat > render-pagecrop-qa.ts <<'TS'
          import fs from 'fs';
          import { createDatabaseConnection, restoreCheckpointFromGzB64 } from './src/db/index.ts';
          import { resolveRepositoryPlayerAvatarPath } from './src/lib/playerAvatarManifest.ts';
          import { internalGetStandings, internalGetNominations } from './src/server/routes/tournamentsRoutes.ts';
          import { loadTournamentAwardSnapshot } from './src/server/services/tournamentAwardsService.ts';
          import { buildGameExportRows, buildOfficialTournamentResultsPresentation, generateGameResultsPages, generateOfficialTournamentResultsPages, generateStandingsPages, type ExportSvgPage } from './src/lib/tournamentResultsExport.ts';

          const out = 'visual-qa/pagecrop';
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(out, { recursive: true });
          const dbPath = '/tmp/newmafia-pagecrop.sqlite';
          fs.rmSync(dbPath, { force: true });
          if (!restoreCheckpointFromGzB64(dbPath)) throw new Error('canonical checkpoint unavailable');
          const db = createDatabaseConnection(dbPath);
          const writePages = (prefix: string, pages: ExportSvgPage[]) => {
            pages.forEach((page, index) => fs.writeFileSync(`${out}/${prefix}-${String(index + 1).padStart(2, '0')}.svg`, page.svg));
            return pages.map((p) => ({ section: p.section, blocks: p.block_ids }));
          };
          try {
            const tournament = await db.get<any>('SELECT * FROM tournaments ORDER BY date DESC, created_at DESC LIMIT 1');
            if (!tournament) throw new Error('tournament missing');
            const tournamentId = String(tournament.id);
            const standingsRes = await internalGetStandings(db, tournamentId);
            const nominationsRes = await internalGetNominations(db, tournamentId);
            const awards = await loadTournamentAwardSnapshot(db, tournamentId);
            const standings = standingsRes.standings || [];
            const avatarRows = await db.all<any>(`SELECT tp.id AS participant_id, tp.player_id, pa.mime_type, pa.image_data FROM tournament_participants tp LEFT JOIN player_avatars pa ON pa.player_id = tp.player_id WHERE tp.tournament_id = ?`, [tournamentId]);
            const avatars: Record<string, string> = {};
            for (const row of avatarRows) {
              let bytes: Buffer | null = null;
              let mime = row.mime_type || 'image/jpeg';
              if (row.image_data) bytes = Buffer.isBuffer(row.image_data) ? row.image_data : Buffer.from(row.image_data);
              else {
                const repoPath = resolveRepositoryPlayerAvatarPath(String(row.player_id), process.cwd());
                if (repoPath) { bytes = fs.readFileSync(repoPath); mime = repoPath.toLowerCase().endsWith('.webp') ? 'image/webp' : 'image/jpeg'; }
              }
              if (bytes) avatars[String(row.participant_id)] = `data:${mime};base64,${bytes.toString('base64')}`;
            }
            const presentation = buildOfficialTournamentResultsPresentation(tournament, standings, awards.slots || [], new Date('2026-08-09T08:00:00.000Z'), avatars, nominationsRes.nominations || []);
            const official = generateOfficialTournamentResultsPages(presentation);
            const totalGames = Number(tournament.total_games_count || 10);
            const completed = Number(standingsRes.completed_games_count || tournament.completed_games_count || 0);
            const intermediate = generateStandingsPages(tournament, standings, Math.max(1, Math.min(completed, totalGames - 1 || completed)), totalGames, avatars);
            const games = await db.all<any>("SELECT * FROM tournament_games WHERE tournament_id = ? AND status = 'completed' ORDER BY game_number ASC", [tournamentId]);
            if (!games.length) throw new Error('completed game missing');
            let selected = games[games.length - 1]; let bestCount = -1;
            for (const game of games) {
              const rows = await db.all<any>('SELECT judge_bonus, protocol_bonus, penalty_points, disciplinary_penalty_points, ci_points FROM tournament_game_player_results WHERE game_id = ?', [game.id]);
              const count = rows.reduce((sum: number, row: any) => sum + ['judge_bonus','protocol_bonus','penalty_points','disciplinary_penalty_points','ci_points'].filter((key) => Math.abs(Number(row[key] || 0)) > 0.0001).length, 0);
              if (count > bestCount) { bestCount = count; selected = game; }
            }
            const raw = await db.all<any>(`SELECT r.*, tgs.seat_number, tgs.role, tp.display_name FROM tournament_game_player_results r JOIN tournament_game_seats tgs ON tgs.game_id=r.game_id AND tgs.participant_id=r.participant_id JOIN tournament_participants tp ON tp.id=r.participant_id WHERE r.game_id=? ORDER BY tgs.seat_number ASC`, [selected.id]);
            const gameRows = buildGameExportRows(raw as any, standings, selected.game_number, avatars);
            const game = generateGameResultsPages(tournament, selected, gameRows);
            const manifest = { tournament: tournament.title, avatars: Object.keys(avatars).length, selectedGame: selected.game_number, official: writePages('official', official), intermediate: writePages('intermediate', intermediate), game: writePages('game', game) };
            fs.writeFileSync(`${out}/manifest.json`, JSON.stringify(manifest, null, 2));
            console.log(JSON.stringify(manifest, null, 2));
          } finally { db.sqlite.close(); fs.rmSync(dbPath, { force: true }); }
          TS
          npx tsx render-pagecrop-qa.ts
          rm render-pagecrop-qa.ts
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin >/dev/null
          for svg in visual-qa/pagecrop/*.svg; do
            png="${svg%.svg}.png"; phone="${svg%.svg}-phone.png"
            rsvg-convert "$svg" -o "$png"
            rsvg-convert -w 390 -h 488 "$svg" -o "$phone"
            rm "$svg"
          done
      - name: Commit viewport fix to candidate branch
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/tournamentResultsExport.ts
          git commit -m "fix(tournaments): paginate export blocks by viewport"
          SHA="$(git rev-parse HEAD)"
          echo "candidate_sha=$SHA"
          git push origin "$SHA:refs/heads/automation/export-preview-pages-candidate-2026-08-09"
      - name: Upload viewport visual QA
        uses: actions/upload-artifact@v4
        with:
          name: export-page-viewport-visual-qa
          path: visual-qa/pagecrop/
          retention-days: 1
