name: ChatGPT finalize export preview pages
on:
  push:
    branches: [automation/export-preview-pages-finalize-2026-08-09]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard current refs and exact candidate scope
        run: |
          set -euo pipefail
          git fetch origin main chatgpt-write-test automation/export-preview-pages-candidate-2026-08-09
          MAIN_SHA="$(git rev-parse origin/main)"
          CHAT_SHA="$(git rev-parse origin/chatgpt-write-test)"
          CANDIDATE_SHA="$(git rev-parse origin/automation/export-preview-pages-candidate-2026-08-09)"
          echo "main=$MAIN_SHA"
          echo "chatgpt-write-test=$CHAT_SHA"
          echo "candidate=$CANDIDATE_SHA"
          test "$MAIN_SHA" = "3021c2fe6d836aa6438e9940eefeac44c541f0f1"
          test "$CHAT_SHA" = "$MAIN_SHA"
          test "$CANDIDATE_SHA" = "ff4f9f027ebe0ee4070697c8ca63d1b001034ad5"
          printf '%s\n' \
            src/components/crm/tournaments/ResultsImageExportModal.tsx \
            src/components/crm/tournaments/TournamentDetailView.tsx \
            src/components/crm/tournaments/TournamentNominationsView.tsx \
            src/components/crm/tournaments/TournamentOfficialResults.tsx \
            src/components/crm/tournaments/TournamentStandingsView.tsx \
            src/lib/tournamentResultsExport.ts \
            src/tests/resultExportPublication.test.ts | sort > /tmp/expected.txt
          git diff --name-only "$MAIN_SHA..$CANDIDATE_SHA" | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          ! grep -E 'mafia_crm|checkpoint|player-avatars|src/db|src/server' /tmp/actual.txt
          git checkout --detach "$CANDIDATE_SHA"
      - name: Install dependencies
        run: npm ci
      - name: Final typecheck exactly once
        run: npm run typecheck
      - name: Final production build exactly once
        run: npm run build
      - name: Final diff check exactly once
        run: git diff --check "origin/main...HEAD"
      - name: Create one final commit and fast-forward both working branches
        run: |
          set -euo pipefail
          git fetch origin main chatgpt-write-test
          MAIN_SHA="$(git rev-parse origin/main)"
          CHAT_SHA="$(git rev-parse origin/chatgpt-write-test)"
          test "$MAIN_SHA" = "3021c2fe6d836aa6438e9940eefeac44c541f0f1"
          test "$CHAT_SHA" = "$MAIN_SHA"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          git config user.name "ChatGPT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          FINAL_SHA="$(printf '%s\n' 'feat(tournaments): add previewable shareable result pages' | git commit-tree "$TREE_SHA" -p "$MAIN_SHA")"
          test "$(git rev-parse "$FINAL_SHA^{tree}")" = "$TREE_SHA"
          echo "final_sha=$FINAL_SHA"
          git push --atomic origin "$FINAL_SHA:refs/heads/main" "$FINAL_SHA:refs/heads/chatgpt-write-test"
          git fetch origin main chatgpt-write-test
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"
          test "$(git rev-parse origin/chatgpt-write-test)" = "$FINAL_SHA"
          echo "main=$(git rev-parse origin/main)"
          echo "chatgpt-write-test=$(git rev-parse origin/chatgpt-write-test)"
