name: ChatGPT export preview pages
on:
  push:
    branches: [automation/export-preview-pages-2026-08-09]
permissions:
  contents: write
jobs:
  implement-and-visualize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture patch inputs and guard current source
        run: |
          set -euo pipefail
          cp automation/patch_export_publication.py /tmp/patch_export_publication.py
          base64 -d automation/export_publication_bundle.tgz.b64 | tar -xz -C /tmp
          git fetch origin main chatgpt-write-test
          MAIN_SHA="$(git rev-parse origin/main)"
          CHAT_SHA="$(git rev-parse origin/chatgpt-write-test)"
          echo "main=$MAIN_SHA"
          echo "chatgpt-write-test=$CHAT_SHA"
          test "$MAIN_SHA" = "3021c2fe6d836aa6438e9940eefeac44c541f0f1"
          test "$CHAT_SHA" = "$MAIN_SHA"
          git checkout --detach "$MAIN_SHA"
          test -z "$(git status --short)"
      - name: Apply one focused export publication pass
        run: |
          set -euo pipefail
          python /tmp/patch_export_publication.py
          printf '%s\n' \
            src/components/crm/tournaments/ResultsImageExportModal.tsx \
            src/components/crm/tournaments/TournamentDetailView.tsx \
            src/components/crm/tournaments/TournamentNominationsView.tsx \
            src/components/crm/tournaments/TournamentOfficialResults.tsx \
            src/components/crm/tournaments/TournamentStandingsView.tsx \
            src/lib/tournamentResultsExport.ts \
            src/tests/resultExportPublication.test.ts | sort > /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          ! git diff --name-only | grep -E 'mafia_crm|player-avatars|checkpoint'
      - name: Install dependencies once for focused verification
        run: npm ci
      - name: Run focused export publication tests
        run: |
          set -euo pipefail
          npx vitest run src/tests/resultExportPublication.test.ts
          cat > share-detection-check.ts <<'TS'
          import { canShareExportFiles } from './src/components/crm/tournaments/ResultsImageExportModal.tsx';
          const files = [{} as File, {} as File];
          const supported = {
            share: async () => undefined,
            canShare: (payload: ShareData) => Array.isArray(payload.files) && payload.files.length === 2,
          } as Pick<Navigator, 'share' | 'canShare'>;
          const unsupported = {
            share: async () => undefined,
            canShare: () => false,
          } as Pick<Navigator, 'share' | 'canShare'>;
          if (!canShareExportFiles(supported, files)) throw new Error('multi-file share detection should be supported');
          if (canShareExportFiles(unsupported, files)) throw new Error('fallback path should be selected when canShare is false');
          console.log('native multi-file share feature detection + visible fallback branch: OK');
          TS
          npx tsx share-detection-check.ts
          rm share-detection-check.ts
      - name: Render all three export types from canonical current data
        run: |
          set -euo pipefail
          cat > render-export-publication-qa.ts <<'TS'
          import fs from 'fs';
          import { createDatabaseConnection, restoreCheckpointFromGzB64 } from './src/db/index.ts';
          import { resolveRepositoryPlayerAvatarPath } from './src/lib/playerAvatarManifest.ts';
          import { internalGetStandings, internalGetNominations } from './src/server/routes/tournamentsRoutes.ts';
          import { loadTournamentAwardSnapshot } from './src/server/services/tournamentAwardsService.ts';
          import {
            buildGameExportRows,
            buildOfficialTournamentResultsPresentation,
            generateGameResultsPages,
            generateOfficialTournamentResultsPages,
            generateStandingsPages,
            type ExportSvgPage,
          } from './src/lib/tournamentResultsExport.ts';

          const out = 'visual-qa/export-publication';
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(out, { recursive: true });
          const dbPath = '/tmp/newmafia-export-publication.sqlite';
          fs.rmSync(dbPath, { force: true });
          if (!restoreCheckpointFromGzB64(dbPath)) throw new Error('canonical checkpoint could not be materialized');
          const db = createDatabaseConnection(dbPath);

          const writePages = (prefix: string, pages: ExportSvgPage[]) => {
            pages.forEach((page, index) => fs.writeFileSync(`${out}/${prefix}-${String(index + 1).padStart(2, '0')}.svg`, page.svg));
            return pages.map((page) => ({ section: page.section, blocks: page.block_ids }));
          };

          try {
            const tournament = await db.get<any>('SELECT * FROM tournaments ORDER BY date DESC, created_at DESC LIMIT 1');
            if (!tournament) throw new Error('current tournament is missing');
            const tournamentId = String(tournament.id);
            const standingsRes = await internalGetStandings(db, tournamentId);
            const nominationsRes = await internalGetNominations(db, tournamentId);
            const awards = await loadTournamentAwardSnapshot(db, tournamentId);
            const standings = standingsRes.standings || [];
            const avatarRows = await db.all<any>(`
              SELECT tp.id AS participant_id, tp.player_id, pa.mime_type, pa.image_data
              FROM tournament_participants tp
              LEFT JOIN player_avatars pa ON pa.player_id = tp.player_id
              WHERE tp.tournament_id = ?
            `, [tournamentId]);
            const avatars: Record<string, string> = {};
            for (const row of avatarRows) {
              let bytes: Buffer | null = null;
              let mime = row.mime_type || 'image/jpeg';
              if (row.image_data) {
                bytes = Buffer.isBuffer(row.image_data) ? row.image_data : Buffer.from(row.image_data);
              } else {
                const repoPath = resolveRepositoryPlayerAvatarPath(String(row.player_id), process.cwd());
                if (repoPath) {
                  bytes = fs.readFileSync(repoPath);
                  mime = repoPath.toLowerCase().endsWith('.webp') ? 'image/webp' : 'image/jpeg';
                }
              }
              if (bytes) avatars[String(row.participant_id)] = `data:${mime};base64,${bytes.toString('base64')}`;
            }

            const presentation = buildOfficialTournamentResultsPresentation(
              tournament,
              standings,
              awards.slots || [],
              new Date('2026-08-09T08:00:00.000Z'),
              avatars,
              nominationsRes.nominations || [],
            );
            const officialPages = generateOfficialTournamentResultsPages(presentation);
            const completedGames = Number(standingsRes.completed_games_count || tournament.completed_games_count || 0);
            const totalGames = Number(tournament.total_games_count || 10);
            const intermediatePages = generateStandingsPages(tournament, standings, Math.max(1, Math.min(completedGames, totalGames - 1 || completedGames)), totalGames, avatars);

            const games = await db.all<any>("SELECT * FROM tournament_games WHERE tournament_id = ? AND status = 'completed' ORDER BY game_number ASC", [tournamentId]);
            if (!games.length) throw new Error('no completed game for QA');
            let selected = games[games.length - 1];
            let bestCount = -1;
            for (const candidate of games) {
              const rows = await db.all<any>('SELECT judge_bonus, protocol_bonus, penalty_points, disciplinary_penalty_points, ci_points FROM tournament_game_player_results WHERE game_id = ?', [candidate.id]);
              const count = rows.reduce((sum: number, row: any) => sum + ['judge_bonus','protocol_bonus','penalty_points','disciplinary_penalty_points','ci_points'].filter((key) => Math.abs(Number(row[key] || 0)) > 0.0001).length, 0);
              if (count > bestCount) { bestCount = count; selected = candidate; }
            }
            const rawResults = await db.all<any>(`
              SELECT r.*, tgs.seat_number, tgs.role, tp.display_name
              FROM tournament_game_player_results r
              JOIN tournament_game_seats tgs ON tgs.game_id = r.game_id AND tgs.participant_id = r.participant_id
              JOIN tournament_participants tp ON tp.id = r.participant_id
              WHERE r.game_id = ?
              ORDER BY tgs.seat_number ASC
            `, [selected.id]);
            const gameRows = buildGameExportRows(rawResults as any, standings, selected.game_number, avatars);
            const gamePages = generateGameResultsPages(tournament, selected, gameRows);

            const manifest = {
              tournament: tournament.title,
              tournamentStatus: tournament.status,
              standings: standings.length,
              avatars: Object.keys(avatars).length,
              selectedGame: selected.game_number,
              selectedGameNonZeroSignals: bestCount,
              official: writePages('official', officialPages),
              intermediate: writePages('intermediate', intermediatePages),
              game: writePages('game', gamePages),
            };
            fs.writeFileSync(`${out}/manifest.json`, JSON.stringify(manifest, null, 2));
            console.log(JSON.stringify(manifest, null, 2));
          } finally {
            db.sqlite.close();
            fs.rmSync(dbPath, { force: true });
          }
          TS
          npx tsx render-export-publication-qa.ts
          rm render-export-publication-qa.ts
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin >/dev/null
          for svg in visual-qa/export-publication/*.svg; do
            png="${svg%.svg}.png"
            phone="${svg%.svg}-phone.png"
            rsvg-convert "$svg" -o "$png"
            rsvg-convert -w 390 -h 488 "$svg" -o "$phone"
          done
          test "$(find visual-qa/export-publication -name 'official-*.png' ! -name '*-phone.png' | wc -l)" -ge 1
          test "$(find visual-qa/export-publication -name 'intermediate-*.png' ! -name '*-phone.png' | wc -l)" -ge 1
          test "$(find visual-qa/export-publication -name 'game-*.png' ! -name '*-phone.png' | wc -l)" -ge 1
          grep -R -q 'Игровые начисления' visual-qa/export-publication/*.svg && { echo 'forbidden copy found'; exit 1; } || true
          grep -R -qE 'ГЛАВНОГО СУДЬИ|ЖЕРЕБ|СЛУЧАЙН' visual-qa/export-publication/official-*.svg && { echo 'forbidden nomination resolution language found'; exit 1; } || true
      - name: Recheck exact source scope and commit candidate
        run: |
          set -euo pipefail
          printf '%s\n' \
            src/components/crm/tournaments/ResultsImageExportModal.tsx \
            src/components/crm/tournaments/TournamentDetailView.tsx \
            src/components/crm/tournaments/TournamentNominationsView.tsx \
            src/components/crm/tournaments/TournamentOfficialResults.tsx \
            src/components/crm/tournaments/TournamentStandingsView.tsx \
            src/lib/tournamentResultsExport.ts \
            src/tests/resultExportPublication.test.ts | sort > /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git config user.name "ChatGPT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/tournamentResultsExport.ts \
            src/components/crm/tournaments/ResultsImageExportModal.tsx \
            src/components/crm/tournaments/TournamentDetailView.tsx \
            src/components/crm/tournaments/TournamentNominationsView.tsx \
            src/components/crm/tournaments/TournamentOfficialResults.tsx \
            src/components/crm/tournaments/TournamentStandingsView.tsx \
            src/tests/resultExportPublication.test.ts
          git commit -m "feat(tournaments): preview shareable result pages"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          echo "candidate_sha=$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/automation/export-preview-pages-candidate-2026-08-09"
      - name: Upload consolidated visual QA
        uses: actions/upload-artifact@v4
        with:
          name: export-publication-visual-qa
          path: visual-qa/export-publication/
          retention-days: 1
