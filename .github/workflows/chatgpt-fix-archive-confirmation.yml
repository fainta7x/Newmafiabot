name: ChatGPT archive confirmation fix

on:
  push:
    branches: [chatgpt-write-test]
    paths:
      - .github/workflows/chatgpt-fix-archive-confirmation.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-write-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply fix
        run: python3 scripts/chatgpt_fix_archive_confirmation.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Remove one-off patch machinery
        run: rm -f scripts/chatgpt_fix_archive_confirmation.py .github/workflows/chatgpt-fix-archive-confirmation.yml
      - name: Commit verified fix
        run: |
          git config user.name "ChatGPT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(games): use in-app archive confirmation"
          git push origin HEAD:chatgpt-write-test
