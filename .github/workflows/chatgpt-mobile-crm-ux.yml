name: ChatGPT mobile CRM UX

on:
  push:
    branches: [chatgpt-write-test]
    paths:
      - '.github/workflows/chatgpt-mobile-crm-ux.yml'
      - 'scripts/chatgpt_mobile_crm_ux.py'
      - 'scripts/chatgpt_mobile_crm_ux_part*.b64'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-write-test
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply mobile CRM UX
        run: python3 scripts/chatgpt_mobile_crm_ux.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Guard data and live-game files
        run: |
          CHANGED="$(git diff --name-only HEAD)"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '(^|/)(mafia_crm.*|.*\.sqlite.*)$'; then
            echo "Database/checkpoint files must not change in this UX iteration."
            exit 1
          fi
          if echo "$CHANGED" | grep -E '(LiveGameEngine|GameProtocolModal|eveningLive.*\.css|tournamentProtocolRoutes|tournament_game_protocol)'; then
            echo "Live-game/protocol files must not change in this UX iteration."
            exit 1
          fi
      - name: Remove one-off patch machinery
        run: |
          rm scripts/chatgpt_mobile_crm_ux.py
          rm scripts/chatgpt_mobile_crm_ux_part0.b64
          rm scripts/chatgpt_mobile_crm_ux_part1.b64
          rm .github/workflows/chatgpt-mobile-crm-ux.yml
      - name: Commit verified mobile UX
        run: |
          git config user.name 'ChatGPT Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ui): improve mobile CRM experience'
          git push origin HEAD:chatgpt-write-test
