name: ChatGPT historical player awards

on:
  push:
    branches: [chatgpt-write-test]
    paths:
      - '.github/workflows/chatgpt-player-historical-awards.yml'
      - 'scripts/chatgpt_player_historical_awards.py'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-write-test
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply historical award support
        run: python3 scripts/chatgpt_player_historical_awards.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Guard data files
        run: |
          git diff --name-only HEAD | grep -E '(^|/)(mafia_crm.*|.*\.sqlite.*)$' && exit 1 || true
      - name: Remove one-off patch machinery
        run: |
          rm scripts/chatgpt_player_historical_awards.py
          rm .github/workflows/chatgpt-player-historical-awards.yml
      - name: Commit verified historical awards
        run: |
          git config user.name 'ChatGPT Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(players): add standalone historical awards'
          git push origin HEAD:chatgpt-write-test
