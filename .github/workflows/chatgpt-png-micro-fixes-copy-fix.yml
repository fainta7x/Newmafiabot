name: ChatGPT tournament PNG copy fix visual
on:
  push:
    branches: [automation/png-micro-fixes-copy-fix-2026-08-09]
permissions:
  contents: write
jobs:
  correct-and-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Checkout current candidate and correct canonical wording
        run: |
          set -euo pipefail
          git fetch origin main automation/png-micro-fixes-candidate-2026-08-09
          MAIN_SHA="$(git rev-parse origin/main)"
          CANDIDATE_SHA="$(git rev-parse origin/automation/png-micro-fixes-candidate-2026-08-09)"
          test "$MAIN_SHA" = "050a606b9fcfbd85ff710ef69ba75358905f4546"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$MAIN_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/tournamentResultsExport.ts')
          s = p.read_text(encoding='utf-8')
          old = "push('protocol', 'Игровые бонусы', reason.protocol_bonus);"
          new = "push('protocol', 'Протокольные начисления', reason.protocol_bonus);"
          if s.count(old) != 1:
              raise SystemExit(f'expected one protocol breakdown label, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "src/lib/tournamentResultsExport.ts"
      - name: Install dependencies
        run: npm ci
      - name: Generate final current tournament-results PNG
        run: |
          set -euo pipefail
          cat > .qa-render-current-official.ts <<'TS'
          import fs from 'fs';
          import { createDatabaseConnection, restoreCheckpointFromGzB64 } from './src/db/index.ts';
          import { resolveRepositoryPlayerAvatarPath } from './src/lib/playerAvatarManifest.ts';
          import { internalGetStandings, internalGetNominations } from './src/server/routes/tournamentsRoutes.ts';
          import { loadTournamentAwardSnapshot } from './src/server/services/tournamentAwardsService.ts';
          import { buildOfficialTournamentResultsPresentation, generateOfficialTournamentResultsSvg } from './src/lib/tournamentResultsExport.ts';
          async function main() {
            const dbPath = '/tmp/newmafia-png-micro-fixes-final.sqlite';
            fs.rmSync(dbPath, { force: true });
            if (!restoreCheckpointFromGzB64(dbPath)) throw new Error('Canonical checkpoint could not be materialized');
            const db = createDatabaseConnection(dbPath);
            fs.mkdirSync('visual-qa', { recursive: true });
            try {
              const tournament = await db.get<any>('SELECT * FROM tournaments ORDER BY date DESC, created_at DESC LIMIT 1');
              if (!tournament) throw new Error('No tournament in canonical snapshot');
              const tournamentId = String(tournament.id);
              const standingsData = await internalGetStandings(db, tournamentId);
              const nominationsData = await internalGetNominations(db, tournamentId);
              const awardSnapshot = await loadTournamentAwardSnapshot(db, tournamentId);
              const avatarRows = await db.all<any>(`
                SELECT tp.id AS participant_id, tp.player_id, pa.mime_type, pa.image_data
                  FROM tournament_participants tp
                  LEFT JOIN player_avatars pa ON pa.player_id = tp.player_id
                 WHERE tp.tournament_id = ?
              `, [tournamentId]);
              const avatars: Record<string, string> = {};
              for (const row of avatarRows) {
                let bytes: Buffer | null = null;
                let mime = row.mime_type || 'image/jpeg';
                if (row.image_data) {
                  bytes = Buffer.isBuffer(row.image_data) ? row.image_data : Buffer.from(row.image_data);
                } else {
                  const repositoryPath = resolveRepositoryPlayerAvatarPath(String(row.player_id), process.cwd());
                  if (repositoryPath) {
                    bytes = fs.readFileSync(repositoryPath);
                    mime = repositoryPath.toLowerCase().endsWith('.webp') ? 'image/webp' : 'image/jpeg';
                  }
                }
                if (bytes) avatars[String(row.participant_id)] = `data:${mime};base64,${bytes.toString('base64')}`;
              }
              const presentation = buildOfficialTournamentResultsPresentation(
                tournament,
                standingsData.standings || [],
                awardSnapshot.slots || [],
                new Date('2026-08-09T08:00:00.000Z'),
                avatars,
                nominationsData.nominations || [],
              );
              const rendered = generateOfficialTournamentResultsSvg(presentation);
              const svg = rendered.svg;
              if (/font-size="340"[^>]*>01<\/text>/.test(svg)) throw new Error('Champion decorative 01 remains');
              if (/font-size="94"[^>]*>0[23]<\/text>/.test(svg)) throw new Error('Secondary decorative podium numeral remains');
              for (let place = 1; place <= 10; place += 1) {
                const label = String(place).padStart(2, '0');
                if (!svg.includes(`>${label}</text>`)) throw new Error(`Ranking ${label} missing`);
              }
              if (/>Баллы(?:\s|<)/i.test(svg) || /Доп\.\s*баллы/i.test(svg)) throw new Error('Generic nomination labels remain');
              if (!svg.includes('Оценка судей') || !svg.includes('Игровые начисления')) throw new Error('Human nomination metric labels missing');
              if (!svg.includes('Протокольные начисления')) throw new Error('Truthful protocol breakdown label missing');
              if (/РЕШЕНИЕ ГЛАВНОГО СУДЬИ|ЖЕРЕБ|СЛУЧАЙН/i.test(svg)) throw new Error('Manual/random resolution copy returned');
              fs.writeFileSync('visual-qa/tournament-results-final.svg', svg);
              console.log(JSON.stringify({ tournament: tournament.title, status: tournament.status, standings: standingsData.standings?.length || 0, nominations: nominationsData.nominations?.length || 0, avatars: Object.keys(avatars).length, width: rendered.width, height: rendered.height }, null, 2));
            } finally {
              db.sqlite.close();
              fs.rmSync(dbPath, { force: true });
            }
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          TS
          npx tsx .qa-render-current-official.ts
          rm -f .qa-render-current-official.ts
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin >/dev/null
          rsvg-convert visual-qa/tournament-results-final.svg -o visual-qa/tournament-results-final.png
          file visual-qa/tournament-results-final.png
      - name: Commit wording correction to candidate
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/tournamentResultsExport.ts
          git commit -m "fix(tournaments): clarify nomination protocol metric"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "$NEW_SHA:refs/heads/automation/png-micro-fixes-candidate-2026-08-09"
          echo "candidate_sha=$NEW_SHA"
      - name: Upload final visual QA PNG
        uses: actions/upload-artifact@v4
        with:
          name: tournament-results-png-micro-fixes-final
          path: visual-qa/tournament-results-final.png
          retention-days: 1
