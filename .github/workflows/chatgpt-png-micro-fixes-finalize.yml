name: ChatGPT finalize tournament PNG micro fixes
on:
  push:
    branches: [automation/png-micro-fixes-finalize-2026-08-09]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard current refs and exact scope
        run: |
          set -euo pipefail
          git fetch origin main chatgpt-write-test automation/png-micro-fixes-candidate-2026-08-09
          BASE_SHA="050a606b9fcfbd85ff710ef69ba75358905f4546"
          CANDIDATE_SHA="3021c2fe6d836aa6438e9940eefeac44c541f0f1"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/chatgpt-write-test)" = "$BASE_SHA"
          test "$(git rev-parse origin/automation/png-micro-fixes-candidate-2026-08-09)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          test "$(git diff --name-only "$BASE_SHA..$CANDIDATE_SHA")" = "src/lib/tournamentResultsExport.ts"
          git checkout --detach "$CANDIDATE_SHA"
      - name: Install dependencies
        run: npm ci
      - name: Final typecheck exactly once
        run: npm run typecheck
      - name: Final production build exactly once
        run: npm run build
      - name: Final diff check exactly once
        run: git diff --check 050a606b9fcfbd85ff710ef69ba75358905f4546..HEAD
      - name: Recheck scope and fast-forward both working branches
        run: |
          set -euo pipefail
          BASE_SHA="050a606b9fcfbd85ff710ef69ba75358905f4546"
          CANDIDATE_SHA="3021c2fe6d836aa6438e9940eefeac44c541f0f1"
          test "$(git diff --name-only "$BASE_SHA..$CANDIDATE_SHA")" = "src/lib/tournamentResultsExport.ts"
          git fetch origin main chatgpt-write-test
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/chatgpt-write-test)" = "$BASE_SHA"
          git push --atomic origin "$CANDIDATE_SHA:refs/heads/main" "$CANDIDATE_SHA:refs/heads/chatgpt-write-test"
          git fetch origin main chatgpt-write-test
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/chatgpt-write-test)" = "$CANDIDATE_SHA"
          echo "final_sha=$CANDIDATE_SHA"
