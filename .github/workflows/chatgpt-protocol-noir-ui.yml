name: ChatGPT protocol Noir UI candidate

on:
  push:
    branches:
      - automation/protocol-noir-ui-2026-08-09

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inspect starting branch HEAD and working tree once
        run: |
          set -euo pipefail
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          git status --short
          git fetch origin main chatgpt-write-test
          test "$(git rev-parse origin/main)" = "d94237900c4318dc4486236e749c3a9eab8fd7d3"
          test "$(git rev-parse origin/chatgpt-write-test)" = "$(git rev-parse origin/main)"

      - name: Apply focused protocol presentation patch
        run: |
          set -euo pipefail
          python automation/patch_protocol_noir_ui.py
          printf '%s\n' \
            src/index.css \
            src/components/crm/tournaments/GameProtocolModal.tsx \
            src/components/crm/tournaments/protocol/ProtocolVotingTab.tsx \
            src/components/crm/tournaments/protocol/ProtocolNightsTab.tsx \
            src/components/crm/tournaments/protocol/ProtocolSummaryTab.tsx \
            src/components/crm/tournaments/protocol/PlayerColorProtocolEditor.tsx \
            src/components/crm/tournaments/protocol/PointStepper.tsx \
            src/components/crm/tournaments/protocol/protocolPlayerPresentationUtils.ts \
            src/tests/protocolNoirUi.test.ts | sort > /tmp/expected.txt
          { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^automation/' | grep -v '^.github/' | sort -u > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          ! grep -E 'mafia_crm|checkpoint|player-avatars|src/db|src/server|src/lib/api|tournamentResultsExport' /tmp/actual.txt

      - name: Install dependencies
        run: npm ci

      - name: Focused protocol UI regression tests
        run: npx vitest run src/tests/protocolNoirUi.test.ts src/tests/PointStepper.test.tsx src/tests/PlayerColorProtocolEditor.test.tsx src/tests/ProtocolSummaryTab.test.tsx

      - name: Commit verified candidate files only
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/index.css \
            src/components/crm/tournaments/GameProtocolModal.tsx \
            src/components/crm/tournaments/protocol/ProtocolVotingTab.tsx \
            src/components/crm/tournaments/protocol/ProtocolNightsTab.tsx \
            src/components/crm/tournaments/protocol/ProtocolSummaryTab.tsx \
            src/components/crm/tournaments/protocol/PlayerColorProtocolEditor.tsx \
            src/components/crm/tournaments/protocol/PointStepper.tsx \
            src/components/crm/tournaments/protocol/protocolPlayerPresentationUtils.ts \
            src/tests/protocolNoirUi.test.ts
          git commit -m "refactor(tournaments): rebuild game protocol in Noir UI"
          git push origin HEAD:refs/heads/automation/protocol-noir-ui-candidate-2026-08-09
