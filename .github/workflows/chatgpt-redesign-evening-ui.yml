name: ChatGPT evening UX redesign

on:
  push:
    branches: [chatgpt-write-test]
    paths:
      - 'scripts/chatgpt_redesign_evening_ui.py'
      - '.github/workflows/chatgpt-redesign-evening-ui.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-write-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply redesign
        run: python3 scripts/chatgpt_redesign_evening_ui.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Remove one-off patch machinery
        run: |
          rm scripts/chatgpt_redesign_evening_ui.py
          rm .github/workflows/chatgpt-redesign-evening-ui.yml
      - name: Commit verified redesign
        run: |
          git config user.name 'ChatGPT Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/crm/EveningWorkspace.tsx src/components/crm/EveningDetailView.tsx scripts/chatgpt_redesign_evening_ui.py .github/workflows/chatgpt-redesign-evening-ui.yml
          git commit -m 'refactor(evenings): simplify mobile workspace UX'
          git push origin HEAD:chatgpt-write-test
