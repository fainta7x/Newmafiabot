name: ChatGPT safety and archive patch

on:
  push:
    branches: [chatgpt-write-test]
    paths:
      - scripts/chatgpt_apply_safety_archive_patch.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-write-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        run: python3 scripts/chatgpt_apply_safety_archive_patch.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Remove one-off patch machinery
        run: rm -f scripts/chatgpt_apply_safety_archive_patch.py .github/workflows/chatgpt-safety-archive-patch.yml
      - name: Commit verified patch
        run: |
          git config user.name "ChatGPT Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(live-game): confirm dangerous actions and archive games"
          git push origin HEAD:chatgpt-write-test
