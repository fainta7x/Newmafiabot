name: checkpoint-attendance-extract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checkpoint-attendance-extract.yml'
      - 'mafia_crm.checkpoint.sqlite.gz.b64'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode checkpoint safely and print bounded historical rows
        shell: bash
        run: |
          set -euo pipefail
          base64 -d mafia_crm.checkpoint.sqlite.gz.b64 > /tmp/mafia.sqlite.gz
          gzip -dc /tmp/mafia.sqlite.gz > /tmp/mafia.sqlite
          python3 - <<'PY'
          import sqlite3, json
          db='/tmp/mafia.sqlite'
          con=sqlite3.connect(f'file:{db}?mode=ro', uri=True)
          con.row_factory=sqlite3.Row
          wanted=['users','evening_booking','evening_booking_history','evening_status','evening_messages','game_dates','game_history','slots_history']
          tables={r[0] for r in con.execute("select name from sqlite_master where type='table'")}
          print('EXTRACT_TABLES', json.dumps(sorted(tables), ensure_ascii=False))
          for t in wanted:
            if t not in tables:
              continue
            cols=[r[1] for r in con.execute(f'pragma table_info("{t}")')]
            print('EXTRACT_SCHEMA', t, json.dumps(cols, ensure_ascii=False))
            rows=con.execute(f'select * from "{t}"').fetchall()
            kept=[]
            for row in rows:
              d=dict(row)
              s=' '.join('' if v is None else str(v) for v in d.values())
              if t=='users' or '2026-07' in s or '2026-08' in s or '17.07' in s or '24.07' in s or '31.07' in s or '07.08' in s or '14.08' in s or '21.08' in s:
                kept.append(d)
            if t=='users':
              kept=kept[:250]
            else:
              kept=kept[:500]
            print('EXTRACT_ROWS', t, json.dumps(kept, ensure_ascii=False, default=str))
          con.close()
          PY
