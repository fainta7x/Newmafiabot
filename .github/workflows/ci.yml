name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-type-cleanup:
    if: github.head_ref == 'ci/enforce-typecheck-20260817' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci/enforce-typecheck-20260817
          fetch-depth: 0
      - name: Apply final strict fixes
        run: node scripts/typecheckFinalThree.mjs
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(types): clear final strict TypeScript errors"
          git push origin HEAD:ci/enforce-typecheck-20260817

  web:
    name: Web checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release data-safety audit
        run: npm run release:audit

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  bot-syntax:
    name: Python bot syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile bot sources
        run: python -m compileall -q main.py config.py commands.py bot_menu.py keyboards.py handlers bot_announcement_api.py bot_api.py bot_profile_link_api.py bot_telegram_api.py
