name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select safe PR checks
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mode=full
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            files=$(git diff --name-only "$BASE_SHA" HEAD)
            if [[ -n "$files" ]]; then
              mode=fast
              while IFS= read -r file; do
                # Fail closed: only individually reviewed presentational files enter fast mode.
                # All other TS/TSX, game, payments, CRM, bot, API, DB, config require full CI.
                case "$file" in
                  docs/*|*.md|*.css|*.scss|src/components/ui/Badge.tsx|src/components/ui/Button.tsx|src/components/ui/Card.tsx|src/components/ui/Input.tsx|src/components/ui/TokenIcon.tsx|src/components/player/PlayerGameGraphics.tsx|src/components/player/PlayerProfileStatsHero.tsx|src/components/player/PlayerBottomNavigation.tsx|src/components/crm/EveningListControls.tsx) ;;
                  *) mode=full; break ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected $mode verification"

  web:
    name: Web checks and build
    needs: scope
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Project handoff integrity
        run: |
          npm run project:status -- --check --json
          npm run project:find -- player --limit=1 --check --json
          npm run project:affected -- src/server/services/tokenLedgerService.ts --check --json

      - name: Release data-safety audit
        run: npm run release:audit

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Release test group manifest
        run: |
          for group in smoke crm live-game telegram vk regression; do
            npx tsx src/scripts/runTestGroup.ts "$group" --list-only
          done

      - name: Focused fast smoke tests
        if: needs.scope.outputs.mode == 'fast'
        run: npm run test:smoke

      - name: Related component tests
        if: needs.scope.outputs.mode == 'fast'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD -- 'src/components/ui/*.tsx' 'src/components/player/*.tsx' 'src/components/crm/*.tsx')
          if (( ${#changed[@]} > 0 )); then
            npx vitest related "${changed[@]}" --run --passWithNoTests
          fi

      - name: CRM module regression for allowed CRM controls
        if: needs.scope.outputs.mode == 'fast'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD -- 'src/components/crm/EveningListControls.tsx' | grep -q .; then
            npm run test:crm
          fi

      - name: Production build
        run: npm run build

  tests:
    # The full suite stays single-worker per shard (isolated forks) but runs as
    # five parallel jobs; together the shards cover every test file.
    name: Tests (shard ${{ matrix.shard }}/5)
    needs: scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test -- --pool=forks --maxWorkers=1 --shard=${{ matrix.shard }}/5

  bot-syntax:
    name: Python bot syntax
    needs: scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile bot sources
        run: python -m compileall -q github_pr_notifications.py main.py config.py commands.py bot_menu.py keyboards.py handlers bot_announcement_api.py bot_api.py bot_profile_link_api.py bot_telegram_api.py

      - name: Bot publishing tests
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests/test_telegram_publishing_duplicates.py tests/test_telegram_evening_copy.py tests/test_organizer_notifications.py tests/test_github_pr_notifications.py tests/test_telegram_achievements_rest.py tests/test_bot_home.py tests/test_tournament_telegram_cancellation.py tests/test_evening_vote_bot.py

  combined-container:
    name: Combined web and bot container
    needs: scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production container
        run: docker build --build-arg NODE_BASE_IMAGE=docker.io/library/node:24-bookworm-slim --tag 2la-noire-combined:ci .

      - name: Verify production server starts without dev dependencies
        shell: bash
        run: |
          export ORGANIZER_PASSWORD="$(printf 'ci-%020d' 0)"
          export JWT_SECRET="$(printf 'jwt-%040d' 0)"
          export BOT_API_SECRET="$(printf 'bot-%040d' 0)"

          docker run --detach --name 2la-noire-runtime-check \
            --entrypoint node \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_PATH=/tmp/ci-runtime.sqlite \
            -e DATABASE_BOOTSTRAP_FROM_CHECKPOINT=true \
            -e SEED_DEMO_DATA=false \
            -e ORGANIZER_PASSWORD \
            -e JWT_SECRET \
            -e BOT_API_SECRET \
            2la-noire-combined:ci dist/server.cjs
          trap 'docker logs 2la-noire-runtime-check || true; docker rm -f 2la-noire-runtime-check >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec 2la-noire-runtime-check node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(x=>{if(x.status!=='ok')process.exit(1)})"; then
              exit 0
            fi
            sleep 1
          done

          echo 'Production server did not become healthy' >&2
          exit 1

  release-gate:
    name: Release gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - scope
      - web
      - tests
      - bot-syntax
      - combined-container
    runs-on: ubuntu-latest
    steps:
      - name: Require all release checks
        env:
          WEB_RESULT: ${{ needs.web.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BOT_RESULT: ${{ needs.bot-syntax.result }}
          CONTAINER_RESULT: ${{ needs.combined-container.result }}
          MODE: ${{ needs.scope.outputs.mode }}
        run: |
          echo "web=$WEB_RESULT"
          echo "tests=$TESTS_RESULT"
          echo "bot-syntax=$BOT_RESULT"
          echo "combined-container=$CONTAINER_RESULT"
          test "$WEB_RESULT" = "success"
          if [[ "$MODE" == "full" ]]; then
            test "$TESTS_RESULT" = "success"
            test "$BOT_RESULT" = "success"
            test "$CONTAINER_RESULT" = "success"
          else
            test "$TESTS_RESULT" = "skipped"
            test "$BOT_RESULT" = "skipped"
            test "$CONTAINER_RESULT" = "skipped"
          fi
