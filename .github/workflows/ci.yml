name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks and build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Project handoff integrity
        run: |
          npm run project:status -- --check --json
          npm run project:find -- player --limit=1 --check --json
          npm run project:affected -- src/server/services/tokenLedgerService.ts --check --json

      - name: Release data-safety audit
        run: npm run release:audit

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e-smoke:
    name: Playwright smoke
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test dependencies
        working-directory: e2e
        run: npm ci

      - name: Audit Playwright dependencies
        working-directory: e2e
        run: npm audit --audit-level=high

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run mobile smoke test
        working-directory: e2e
        run: npm test

      - name: Upload Live Game browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-evidence
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  bot-syntax:
    name: Python bot syntax
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile bot sources
        run: python -m compileall -q main.py config.py commands.py bot_menu.py keyboards.py handlers bot_announcement_api.py bot_api.py bot_profile_link_api.py bot_telegram_api.py
