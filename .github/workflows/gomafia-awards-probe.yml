name: GoMafia awards probe (temporary)

# One-off, read-only look at the PUBLIC pages of GoMafia (no login, no cookies) to see where awards and nominations of a player
# and of a tournament are published. Prints key paths and short samples only. Remove this file after the source is documented.
on:
  pull_request:
    paths:
      - '.github/workflows/gomafia-awards-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe public pages
        run: |
          cat > probe.mjs <<'JS'
          const UA = { 'user-agent': 'Mozilla/5.0 (compatible; 2la-noire-probe)' };
          const AWARD = /award|nominat|prize|cup|medal|trophy|achiev|rewar|badge|наград|номин|кубок|медал/i;
          const fetchText = async (url) => { const r = await fetch(url, { headers: UA }); return { status: r.status, text: await r.text() }; };
          const nextData = (html) => { const m = html.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/); return m ? JSON.parse(m[1]) : null; };
          const walk = (value, path, hits, shape, depth = 0) => {
            if (depth > 8) return;
            if (Array.isArray(value)) {
              shape.push(`${path}[] len=${value.length}`);
              value.slice(0, 2).forEach((item, i) => walk(item, `${path}[${i}]`, hits, shape, depth + 1));
              if (AWARD.test(path)) hits.push({ path, sample: JSON.stringify(value.slice(0, 3)).slice(0, 700) });
            } else if (value && typeof value === 'object') {
              for (const [key, item] of Object.entries(value)) {
                const p = `${path}.${key}`;
                if (AWARD.test(key)) hits.push({ path: p, sample: JSON.stringify(item).slice(0, 700) });
                walk(item, p, hits, shape, depth + 1);
              }
            } else shape.push(`${path} = ${JSON.stringify(value)?.slice(0, 40)}`);
          };
          for (const url of ['https://gomafia.pro/stats/1202', 'https://gomafia.pro/tournament/2765', 'https://gomafia.pro/tournament/1846']) {
            console.log(`\n===== ${url}`);
            try {
              const { status, text } = await fetchText(url);
              console.log('status', status, 'bytes', text.length);
              const words = [...text.matchAll(/(Наград[а-яё]*|Номинац[а-яё]*|Кубок|Медал[а-яё]*)/gi)].map((m) => m[0]);
              console.log('visible words:', JSON.stringify([...new Set(words)].slice(0, 20)));
              const data = nextData(text);
              if (!data) { console.log('no __NEXT_DATA__'); continue; }
              const serverData = data?.props?.pageProps?.serverData ?? data?.props?.pageProps;
              console.log('serverData keys:', JSON.stringify(Object.keys(serverData || {})));
              const hits = []; const shape = [];
              walk(serverData, 'serverData', hits, shape);
              console.log('--- award-like keys:', hits.length);
              hits.slice(0, 25).forEach((h) => console.log(h.path, '=>', h.sample));
              console.log('--- shape (first 120 paths):');
              shape.slice(0, 120).forEach((line) => console.log(line));
            } catch (error) { console.log('failed', String(error)); }
          }
          JS
          node probe.mjs
