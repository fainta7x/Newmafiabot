name: Normalize destructured Express 5 params

on:
  push:
    branches:
      - deps/express-5-2-1-20260817

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: deps/express-5-2-1-20260817
          fetch-depth: 0

      - name: Normalize simple destructured route params
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = [
              'src/server/routes/tournamentProtocolRoutes.ts',
              'src/server/routes/tournamentsRoutesBase.ts',
          ]
          pattern = re.compile(r'^(\s*)const \{\s*([^}]+?)\s*\} = req\.params;\s*$', re.MULTILINE)
          identifier = re.compile(r'^[A-Za-z_][A-Za-z0-9_]*$')
          total = 0

          for filename in files:
              path = Path(filename)
              text = path.read_text()

              def replace(match):
                  nonlocal_total[0] += 1
                  indent = match.group(1)
                  parts = [part.strip() for part in match.group(2).split(',') if part.strip()]
                  bindings = []
                  for part in parts:
                      pieces = [piece.strip() for piece in part.split(':')]
                      if len(pieces) == 1:
                          source = target = pieces[0]
                      elif len(pieces) == 2:
                          source, target = pieces
                      else:
                          raise SystemExit(f'Unsupported req.params destructuring in {filename}: {match.group(0)}')
                      if not identifier.fullmatch(source) or not identifier.fullmatch(target):
                          raise SystemExit(f'Unsupported req.params destructuring in {filename}: {match.group(0)}')
                      bindings.append((source, target))
                  if not bindings:
                      raise SystemExit(f'Empty req.params destructuring in {filename}: {match.group(0)}')
                  return '\n'.join(
                      f'{indent}const {target} = String(req.params.{source});'
                      for source, target in bindings
                  )

              nonlocal_total = [0]
              updated = pattern.sub(replace, text)
              if nonlocal_total[0]:
                  path.write_text(updated)
                  total += nonlocal_total[0]
                  print(f'{filename}: normalized {nonlocal_total[0]} destructuring statement(s)')

          if total < 2:
              raise SystemExit(f'Expected at least two destructured req.params statements, got {total}')
          print(f'Total normalized destructuring statements: {total}')
          PY

      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/routes/tournamentProtocolRoutes.ts src/server/routes/tournamentsRoutesBase.ts
          git commit -m "types: normalize destructured Express 5 route params"
          git push origin HEAD:${GITHUB_REF_NAME}
