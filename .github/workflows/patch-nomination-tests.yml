name: Patch obsolete nomination tie tests

on:
  push:
    branches:
      - test/restore-nomination-tie-coverage-20260818

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/restore-nomination-tie-coverage-20260818
          fetch-depth: 0

      - name: Replace obsolete nomination expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/tests/ci_fsm_tie_nominations.test.ts')
          text = path.read_text()

          marker37 = "  it('37. nominations has_tie is true when two candidates share maximum score'"
          marker38 = "  it('38. nominations candidates are fully sorted descending'"
          marker45 = "  it('45. PUT nomination tie-break successfully resolves and updates nominations winner'"
          marker46 = "  it('46. GET /api/tournaments/:id/final-readiness reports accurate unresolved ties'"

          replacement37 = r'''  it('37. terminal nomination equality has no manual winner and does not set blocking tie', async () => {
            await db.run("DELETE FROM tournament_games WHERE tournament_id = ?", [tournamentId]);

            await addMockCompletedGame(db, tournamentId, 1, 'red', [
              { playerId: 'tp1', role: 'sheriff', isWinner: true, protocolBonus: 0.5 },
              { playerId: 'tp2', role: 'sheriff', isWinner: true, protocolBonus: 0.5 }
            ]);

            const res = await request(app)
              .get(`/api/tournaments/${tournamentId}/nominations`)
              .set('Cookie', organizerCookie);

            const bestSheriff = res.body.nominations.find((n: any) => n.category === 'best_sheriff');
            expect(bestSheriff.has_tie).toBe(false);
            expect(bestSheriff.winner_participant_id).toBeNull();
            expect(bestSheriff.decisive_criterion).toBe('exact_tie');
          });

'''

          replacement45 = r'''  it('45. terminal nomination equality rejects manual resolution and keeps no winner', async () => {
            await db.run("DELETE FROM tournament_games WHERE tournament_id = ?", [tournamentId]);
            await addMockCompletedGame(db, tournamentId, 1, 'red', [
              { playerId: 'tp1', role: 'sheriff', isWinner: true, protocolBonus: 1.5 },
              { playerId: 'tp2', role: 'sheriff', isWinner: true, protocolBonus: 1.5 },
            ]);

            const nomsRes = await request(app)
              .get(`/api/tournaments/${tournamentId}/nominations`)
              .set('Cookie', organizerCookie);
            const bestSheriff = nomsRes.body.nominations.find((n: any) => n.category === 'best_sheriff');
            expect(bestSheriff.has_tie).toBe(false);
            expect(bestSheriff.winner_participant_id).toBeNull();
            expect(bestSheriff.decisive_criterion).toBe('exact_tie');

            const manualPut = await request(app)
              .put(`/api/tournaments/${tournamentId}/final-resolutions/nominations/best_sheriff`)
              .set('Cookie', organizerCookie)
              .send({
                winner_participant_id: 'tp1',
                resolution_method: 'chief_judge_decision',
              });
            expect(manualPut.status).toBe(410);

            const updatedNoms = await request(app)
              .get(`/api/tournaments/${tournamentId}/nominations`)
              .set('Cookie', organizerCookie);
            const updatedSheriff = updatedNoms.body.nominations.find((n: any) => n.category === 'best_sheriff');
            expect(updatedSheriff.winner_participant_id).toBeNull();
            expect(updatedSheriff.decisive_criterion).toBe('exact_tie');
          });

'''

          replacement46 = r'''  it('46. final-readiness ignores terminal nomination equality and only blocks standings ties', async () => {
            await db.run("DELETE FROM tournament_games WHERE tournament_id = ?", [tournamentId]);
            await addMockCompletedGame(db, tournamentId, 1, 'red', [
              { playerId: 'tp1', role: 'sheriff', isWinner: true, protocolBonus: 1.0 },
              { playerId: 'tp2', role: 'sheriff', isWinner: true, protocolBonus: 1.0 },
            ]);

            const readinessRes = await request(app)
              .get(`/api/tournaments/${tournamentId}/final-readiness`)
              .set('Cookie', organizerCookie);

            expect(readinessRes.status).toBe(200);
            expect(readinessRes.body.ready).toBe(false);
            expect(readinessRes.body.unresolved_standings_ties.length).toBe(1);
            expect(readinessRes.body.unresolved_nomination_ties).toEqual([]);

            const tgId = readinessRes.body.unresolved_standings_ties[0].tie_group_id;
            const standingResolution = await request(app)
              .put(`/api/tournaments/${tournamentId}/final-resolutions/standings/${tgId}`)
              .set('Cookie', organizerCookie)
              .send({
                ordered_participant_ids: ['tp1', 'tp2'],
                resolution_method: 'chief_judge_decision',
              });
            expect(standingResolution.status).toBe(200);

            const finalReadiness = await request(app)
              .get(`/api/tournaments/${tournamentId}/final-readiness`)
              .set('Cookie', organizerCookie);
            expect(finalReadiness.status).toBe(200);
            expect(finalReadiness.body.ready).toBe(true);
            expect(finalReadiness.body.unresolved_standings_ties).toEqual([]);
            expect(finalReadiness.body.unresolved_nomination_ties).toEqual([]);
          });
'''

          a = text.index(marker37)
          b = text.index(marker38)
          text = text[:a] + replacement37 + text[b:]

          a = text.index(marker45)
          b = text.index(marker46)
          text = text[:a] + replacement45 + text[b:]

          a = text.index(marker46)
          close = text.rfind('\n});')
          if close <= a:
              raise RuntimeError('Could not locate final describe close')
          text = text[:a] + replacement46 + text[close:]

          path.write_text(text)
          PY

      - name: Commit patched tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tests/ci_fsm_tie_nominations.test.ts
          git commit -m "test: align nomination tie integration coverage" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
