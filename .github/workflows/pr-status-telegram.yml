name: PR status to Telegram

# Runs trusted code from main; never executes or checks out PR changes.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  notify:
    name: Telegram PR status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Use Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check notifier syntax
        run: python -m py_compile scripts/telegram_pr_digest.py

      - name: Send status to organizer
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_PR_BOT_TOKEN: ${{ secrets.TELEGRAM_PR_BOT_TOKEN }}
          TELEGRAM_PR_CHAT_ID: ${{ secrets.TELEGRAM_PR_CHAT_ID }}
        run: python scripts/telegram_pr_digest.py
