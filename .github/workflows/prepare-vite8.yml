name: Prepare Vite 8 migration

on:
  push:
    branches:
      - deps/vite-8-2-0-20260817

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: deps/vite-8-2-0-20260817
          fetch-depth: 0

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Update Vite toolchain manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('package.json')
          package = json.loads(path.read_text())
          package['devDependencies']['vite'] = '^8.2.0'
          package['devDependencies']['@vitejs/plugin-react'] = '^6.0.4'
          package['devDependencies']['esbuild'] = '^0.28.1'
          path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "deps: upgrade Vite toolchain"
          git push origin HEAD:${GITHUB_REF_NAME}
