name: Audit runtime monitor probe

on:
  push:
    branches:
      - audit/runtime-monitor-probe-20260921

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Probe current production with main runtime monitor
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe production using current runtime monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_MONITOR_BASE_URL: ${{ vars.RUNTIME_MONITOR_BASE_URL || vars.PLAYER_APP_URL }}
          TELEGRAM_MONITOR_BOT_TOKEN: ${{ secrets.TELEGRAM_MONITOR_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_MONITOR_CHAT_IDS: ${{ secrets.TELEGRAM_MONITOR_CHAT_IDS || secrets.RUNTIME_ALERT_RECIPIENT_IDS || secrets.ORGANIZER_NOTIFICATION_IDS || secrets.ORGANIZER_CHAT_ID }}
          MONITOR_TEST_NOTIFICATION: false
        run: node scripts/runtimeMonitor.mjs
