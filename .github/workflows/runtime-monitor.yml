name: Production runtime monitor

on:
  schedule:
    # Avoid the top of the hour, when scheduled GitHub Actions are most likely to queue.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: Send a Telegram test notification instead of probing production
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: production-runtime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check web, database, bot and Telegram
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe production and notify Telegram on transitions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_MONITOR_BASE_URL: ${{ vars.RUNTIME_MONITOR_BASE_URL }}
          TELEGRAM_MONITOR_BOT_TOKEN: ${{ secrets.TELEGRAM_MONITOR_BOT_TOKEN }}
          TELEGRAM_MONITOR_CHAT_IDS: ${{ secrets.TELEGRAM_MONITOR_CHAT_IDS }}
          MONITOR_TEST_NOTIFICATION: ${{ inputs.send_test_notification }}
        run: node scripts/runtimeMonitor.mjs
