name: Stage 2 lockfile refresh

on:
  push:
    branches:
      - design/headless-ui-34
    paths:
      - .github/workflows/stage2-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/headless-ui-34
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Add Base UI and refresh lockfile
        run: npm install @base-ui/react@1.6.0 --save-exact --package-lock-only
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deps: add Base UI 1.6.0"
          git push origin HEAD:design/headless-ui-34
