name: Temporary Live vote UX patch

on:
  push:
    branches:
      - feat/live-vote-undo-phase-label

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/live-vote-undo-phase-label
          fetch-depth: 0
      - name: Apply exact scoped patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          engine = 'src/components/LiveGameEngine.tsx'
          center = 'src/components/LiveGameEngine/CenterPanel.tsx'
          css = 'src/components/crm/liveGameEveningBugfixes.css'

          replace_once(engine,
          '''  const updateCurrentRoundVotes = (assignments: Record<number, number>) => {\n''',
          '''  const sameVoteAssignments = (left: Record<number, number>, right: Record<number, number>) => {\n    const keys = new Set([...Object.keys(left), ...Object.keys(right)]);\n    return Array.from(keys).every((key) => left[Number(key)] === right[Number(key)]);\n  };\n\n  const findLastVoteHistoryIndex = () => {\n    const currentRound = votingRounds[activeVotingRoundIndex];\n    if (phase !== 'day_voting' || votingStage !== 'collecting' || !currentRound) return -1;\n\n    for (let index = historyStack.length - 1; index >= 0; index -= 1) {\n      const snapshot = normalizeLiveSnapshotForRestore(historyStack[index]);\n      const snapshotRound = snapshot.votingRounds[snapshot.activeVotingRoundIndex];\n      const sameRound = snapshot.phase === 'day_voting'\n        && snapshot.votingStage === 'collecting'\n        && snapshot.roundNumber === roundNumber\n        && snapshot.activeVotingRoundIndex === activeVotingRoundIndex\n        && snapshotRound?.round_number === currentRound.round_number\n        && snapshotRound?.nominated_seats.join(',') === currentRound.nominated_seats.join(',');\n      if (!sameRound) continue;\n      if (!sameVoteAssignments(snapshot.votesByPlayer, votesByPlayer)) return index;\n    }\n    return -1;\n  };\n\n  const updateCurrentRoundVotes = (assignments: Record<number, number>) => {\n''')

          replace_once(engine,
          '''  const handleFinalizeVote = () => {\n''',
          '''  const handleUndoLastVote = () => {\n    const historyIndex = findLastVoteHistoryIndex();\n    if (historyIndex < 0) return showToast('Нет голосов для отмены', 'warning');\n\n    const sourceSnapshot = normalizeLiveSnapshotForRestore(historyStack[historyIndex]);\n    const restoredAssignments = { ...sourceSnapshot.votesByPlayer };\n    setVotesByPlayer(restoredAssignments);\n    updateCurrentRoundVotes(restoredAssignments);\n\n    // Keep unrelated history entries (for example a foul applied after the vote),\n    // but rewrite their vote slice so a later generic Undo cannot resurrect this vote.\n    setHistoryStack((previous) => previous.reduce<LiveSnapshot[]>((next, item, index) => {\n      if (index === historyIndex) return next;\n      if (index < historyIndex) {\n        next.push(item);\n        return next;\n      }\n\n      const snapshot = normalizeLiveSnapshotForRestore(item);\n      const snapshotRound = snapshot.votingRounds[snapshot.activeVotingRoundIndex];\n      const currentRound = votingRounds[activeVotingRoundIndex];\n      const sameRound = snapshot.phase === 'day_voting'\n        && snapshot.roundNumber === roundNumber\n        && snapshot.activeVotingRoundIndex === activeVotingRoundIndex\n        && snapshotRound?.round_number === currentRound?.round_number\n        && snapshotRound?.nominated_seats.join(',') === currentRound?.nominated_seats.join(',');\n      if (!sameRound || !snapshotRound) {\n        next.push(item);\n        return next;\n      }\n\n      const eligibleSeats = snapshot.activePlayers.filter((player) => player.alive).map((player) => player.slot_num);\n      const restoredCounts = getExplicitVoteCounts(snapshotRound.nominated_seats, restoredAssignments, eligibleSeats);\n      next.push(cloneLiveSnapshot({\n        ...snapshot,\n        votesByPlayer: { ...restoredAssignments },\n        votes: restoredCounts,\n        votingRounds: snapshot.votingRounds.map((round, roundIndex) => roundIndex === activeVotingRoundIndex\n          ? { ...round, vote_counts: restoredCounts }\n          : round),\n      }));\n      return next;\n    }, []));\n    showToast('Последний голос отменён', 'info');\n  };\n\n  const canUndoLastVote = findLastVoteHistoryIndex() >= 0;\n\n  const handleFinalizeVote = () => {\n''')

          replace_once(engine,
          '''      handleInteractiveAutoRemainder: handleFinalizeVote,\n      handleAllocateVotes,\n''',
          '''      handleInteractiveAutoRemainder: handleFinalizeVote,\n      canUndoLastVote,\n      handleUndoLastVote,\n      handleAllocateVotes,\n''')

          replace_once(center,
          '''  handleInteractiveAutoRemainder: () => void;\n  handleAllocateVotes: (nominee: number, count: number) => void;\n''',
          '''  handleInteractiveAutoRemainder: () => void;\n  canUndoLastVote?: boolean;\n  handleUndoLastVote?: () => void;\n  handleAllocateVotes: (nominee: number, count: number) => void;\n''')

          replace_once(center,
          '''    handleInteractiveAutoRemainder,\n    handleResolveVoting,\n''',
          '''    handleInteractiveAutoRemainder,\n    canUndoLastVote = false,\n    handleUndoLastVote,\n    handleResolveVoting,\n''')

          replace_once(center,
          '''  const phaseLabel = phase === 'zero_night'\n    ? 'Нулевая ночь'\n    : phase === 'night'\n      ? `Ночь ${roundNumber}`\n      : phase === 'day_voting'\n        ? `Голосование · ${dayLabel}`\n        : dayLabel;\n''',
          '''  const votingPhaseLabel = (() => {\n    if (phase !== 'day_voting') return null;\n    if (votingStage === 'collecting' || votingStage === 'setup') {\n      const nominee = currentRound?.nominated_seats[currentVotingNomineeIndex];\n      return nominee ? `Голосование · кандидат #${nominee}` : 'Голосование';\n    }\n    if (votingStage === 'revote_speeches') {\n      const speaker = currentVotingResult?.winners[revoteSpeakerIndex] ?? activeSpeakerSlot;\n      return speaker ? `Переголосование · речь #${speaker}` : 'Переголосование · речи';\n    }\n    if (votingStage === 'round_result') return 'Голосование · итог';\n    if (votingStage === 'table_decision') return 'Голосование · решение стола';\n    if (votingStage === 'resolved' && activeSpeakerSlot !== null) return `Последняя речь · #${activeSpeakerSlot}`;\n    return 'Голосование · завершено';\n  })();\n\n  const phaseLabel = phase === 'zero_night'\n    ? 'Нулевая ночь'\n    : phase === 'night'\n      ? `Ночь ${roundNumber}`\n      : votingPhaseLabel ?? dayLabel;\n''')

          replace_once(center,
          '''          <div className="live-judge-vote-summary">\n            <div className="live-judge-stat"><div className="live-judge-stat__label">Голосов</div><div className="live-judge-stat__value">{currentVotes}</div></div>\n            <div className="live-judge-stat"><div className="live-judge-stat__label">Осталось</div><div className="live-judge-stat__value">{remaining}/{eligible}</div></div>\n          </div>\n          <div className="live-judge-hud__hint">\n            {isLast\n              ? 'Нажимайте карточки голосующих. Неотмеченные голоса уйдут сюда только при подведении итога.'\n              : `Нажимайте карточки игроков, голосующих против #${nominee}.`}\n          </div>\n''',
          '''          <div className="live-judge-vote-summary live-judge-vote-summary--with-undo">\n            <div className="live-judge-stat"><div className="live-judge-stat__label">Голосов</div><div className="live-judge-stat__value">{currentVotes}</div></div>\n            <div className="live-judge-stat"><div className="live-judge-stat__label">Осталось</div><div className="live-judge-stat__value">{remaining}/{eligible}</div></div>\n            <button\n              type="button"\n              aria-label="Отменить последний голос"\n              title="Отменить последний голос"\n              disabled={!canUndoLastVote || pendingVotingResolution}\n              onClick={() => handleUndoLastVote?.()}\n              className="live-judge-stat live-judge-vote-undo"\n            >\n              <span className="live-judge-stat__label">Отмена</span>\n              <span className="live-judge-vote-undo__value"><RotateCcw />голос</span>\n            </button>\n          </div>\n          <div className="live-judge-hud__hint">\n            {isLast\n              ? `Нажмите голосующих. Остаток уйдёт к #${nominee} при подведении итога.`\n              : `Нажмите игроков, голосующих против #${nominee}.`}\n          </div>\n''')

          p = Path(css)
          text = p.read_text()
          marker = '''.live-judge-voting-order__seat--current {\n  border-color: rgba(251, 113, 133, 0.52);\n  background: rgba(225, 52, 88, 0.17);\n  color: #ffe0e7;\n}\n'''
          addition = marker + '''\n.live-judge-vote-summary--with-undo {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 6px;\n}\n\n.live-judge-vote-undo {\n  width: 100%;\n  appearance: none;\n  cursor: pointer;\n  text-align: left;\n}\n\n.live-judge-vote-undo:disabled {\n  cursor: default;\n  opacity: 0.34;\n}\n\n.live-judge-vote-undo__value {\n  display: flex;\n  align-items: center;\n  gap: 3px;\n  margin-top: 2px;\n  color: rgba(255, 255, 255, 0.82);\n  font-size: 10px;\n  font-weight: 800;\n  line-height: 1;\n}\n\n.live-judge-vote-undo__value svg {\n  width: 10px;\n  height: 10px;\n  flex: none;\n}\n'''
          if text.count(marker) != 1:
              raise SystemExit('CSS marker mismatch')
          text = text.replace(marker, addition, 1)
          mobile_marker = '''  .live-judge-hud__stack--voting-scroll:has(> .live-judge-vote-summary) > .live-judge-vote-summary {\n    gap: 3px;\n  }\n'''
          mobile_addition = mobile_marker + '''\n  .live-judge-hud__stack--voting-scroll:has(> .live-judge-vote-summary) .live-judge-vote-undo__value {\n    gap: 2px;\n    margin-top: 1px;\n    font-size: 7px;\n  }\n\n  .live-judge-hud__stack--voting-scroll:has(> .live-judge-vote-summary) .live-judge-vote-undo__value svg {\n    width: 8px;\n    height: 8px;\n  }\n'''
          if text.count(mobile_marker) != 1:
              raise SystemExit('mobile CSS marker mismatch')
          p.write_text(text.replace(mobile_marker, mobile_addition, 1))
          PY
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LiveGameEngine.tsx src/components/LiveGameEngine/CenterPanel.tsx src/components/crm/liveGameEveningBugfixes.css
          git commit -m "Add vote-specific undo and phase step labels"
          git push origin HEAD:feat/live-vote-undo-phase-label
