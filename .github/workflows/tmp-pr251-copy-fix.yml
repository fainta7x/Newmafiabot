name: Temporary PR251 copy fix

on:
  push:
    branches:
      - feat/live-vote-undo-phase-label

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/live-vote-undo-phase-label
          fetch-depth: 0
      - name: Restore compact guardrail copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/LiveGameEngine/CenterPanel.tsx')
          text = p.read_text()
          old = """            {isLast
              ? `Нажмите голосующих. Остаток уйдёт к #${nominee} при подведении итога.`
              : `Нажмите игроков, голосующих против #${nominee}.`}
"""
          new = """            {isLast
              ? 'Неотмеченные голоса уйдут сюда только при подведении итога.'
              : `Нажимайте карточки игроков против #${nominee}.`}
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exact voting copy once, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/tmp-pr251-copy-fix.yml
      - name: Commit clean fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LiveGameEngine/CenterPanel.tsx
          git commit -m "Restore voting guardrail copy"
          git push origin HEAD:feat/live-vote-undo-phase-label
