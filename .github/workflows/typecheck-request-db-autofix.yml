name: Typecheck request-db autofix

on:
  push:
    branches: [ci/enforce-typecheck-20260817]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci/enforce-typecheck-20260817
          fetch-depth: 0

      - name: Apply request-db typing codemod
        run: node scripts/fixRequestDbTyping.mjs

      - name: Commit generated source cleanup
        run: |
          if git diff --quiet; then
            echo "No codemod changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(types): use typed request database context"
          git push origin HEAD:ci/enforce-typecheck-20260817
