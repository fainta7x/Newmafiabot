name: UI preview

on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * 0'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'preview/**'
      - 'scripts/buildUiPreview.mjs'
      - 'scripts/selectUiPreviewScope.mjs'
      - 'vite.config.ts'
      - 'package*.json'
      - '.github/workflows/ui-preview.yml'

permissions:
  contents: read

concurrency:
  group: ui-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Mobile preview and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected UI checks
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/selectUiPreviewScope.mjs
      - if: steps.scope.outputs.preview_skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - if: steps.scope.outputs.preview_skip != 'true'
        run: npm ci
      - if: steps.scope.outputs.preview_skip != 'true'
        run: npm ci
        working-directory: e2e
      - name: Build isolated preview (no database or secrets)
        if: steps.scope.outputs.preview_skip != 'true'
        run: node scripts/buildUiPreview.mjs
      - name: Check mobile screens
        if: steps.scope.outputs.preview_skip != 'true'
        run: npx playwright test --config playwright-preview.config.mjs
        working-directory: e2e
        env:
          UI_PREVIEW_SPECS: ${{ steps.scope.outputs.preview_specs }}
      - name: Save web preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-site
          path: temp/ui-preview
          retention-days: 14
      - name: Save mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-evidence
          path: e2e/preview-results
          retention-days: 14

  layout-audit:
    name: Layout and text audit (affected pages or full)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected UI checks
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/selectUiPreviewScope.mjs
      - if: steps.scope.outputs.audit_skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - if: steps.scope.outputs.audit_skip != 'true'
        run: npm ci
      - if: steps.scope.outputs.audit_skip != 'true'
        run: npm ci
        working-directory: e2e
      - name: Build isolated preview (no database or secrets)
        if: steps.scope.outputs.audit_skip != 'true'
        run: node scripts/buildUiPreview.mjs
      - name: Check app pages for text on text, truncation and covered buttons
        if: steps.scope.outputs.audit_skip != 'true'
        run: |
          if [ -n "$UI_AUDIT_GREP" ]; then
            npx playwright test --config playwright-layout-audit.config.mjs --grep "$UI_AUDIT_GREP"
          else
            npx playwright test --config playwright-layout-audit.config.mjs
          fi
        working-directory: e2e
        env:
          UI_AUDIT_GREP: ${{ steps.scope.outputs.audit_grep }}
      - name: Save audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-audit-evidence
          path: e2e/layout-audit-results
          retention-days: 14
