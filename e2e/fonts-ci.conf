<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Local browser runs with the fonts CI has: the system fonts without Inter (CI's Ubuntu image has no Inter, so labels
     render in DejaVu Sans there, which is wider). Use: FONTCONFIG_FILE=e2e/fonts-ci.conf npx playwright test … -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont><glob>/usr/share/fonts/opentype/inter/*</glob></rejectfont></selectfont>
</fontconfig>
