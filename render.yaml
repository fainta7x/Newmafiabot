previews:
  generation: off

services:
  - type: web
    name: 2la-noire-web-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/2la-noire-web-staging/mafia_crm.sqlite
      - key: SEED_DEMO_DATA
        value: false
      - key: DATABASE_BOOTSTRAP_FROM_CHECKPOINT
        value: true
      - key: ORGANIZER_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_API_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VK_GROUP_ID
        value: 212761164
      - key: VK_GROUP_SCREEN_NAME
        value: 2lanoiremafia
      - key: VK_GROUP_URL
        value: https://vk.ru/2lanoiremafia
      - key: VK_CHANNEL_URL
        value: https://vk.ru/im/channels/-233806277
      - key: VK_APP_ID
        value: 54719021
      - key: VK_API_VERSION
        value: 5.199
