previews:
  generation: off

services:
  - type: web
    name: 2la-noire-web-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/2la-noire-web-staging/mafia_crm.sqlite
      - key: SEED_DEMO_DATA
        value: false
      - key: DATABASE_BOOTSTRAP_FROM_CHECKPOINT
        value: true
      - key: ORGANIZER_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_API_SECRET
        generateValue: true
